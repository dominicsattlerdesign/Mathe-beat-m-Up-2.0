<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mathe-Raufbold</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: Vollbild-3D-Arena, Kampfleisten oben, Touch-Steuerpult unten (Angriffskarten links, Zahlenfeld rechts) */
:root{
  --bg:#0b0a14; --panel:#191530; --panel2:#262046; --ink:#f4f0ff; --dim:#a79fc7; --line:#05040a;
  --hot:#ff3b2f; --gold:#ffc21a; --cyan:#25d4ff; --violet:#9a6bff; --hp:#3fe06b;
  --disp:"Bangers",Impact,"Arial Black",sans-serif; --ui:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:500;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;background:var(--bg);display:block}
#c.impact{filter:invert(1) grayscale(1) contrast(2.2)}

/* ---------- Kino-Effekte ---------- */
.lb{position:fixed;left:0;right:0;height:11vh;background:var(--line);transition:transform .25s;pointer-events:none;z-index:3}
#lb1{top:0;transform:translateY(-100%)}#lb2{bottom:0;transform:translateY(100%)}
body.cine .lb{transform:none}
body.cine #hud,body.cine #panel{opacity:0;pointer-events:none}
#speed{position:fixed;inset:-20%;pointer-events:none;opacity:0;z-index:2;
  background:repeating-conic-gradient(from 0deg,transparent 0 3.2deg,rgba(255,255,255,.55) 3.4deg 3.9deg,transparent 4.1deg 7deg);
  -webkit-mask:radial-gradient(circle,transparent 28%,#000 75%);mask:radial-gradient(circle,transparent 28%,#000 75%)}
#speed.on{opacity:.85;animation:spd .09s steps(2) infinite}
@keyframes spd{50%{transform:rotate(2.3deg) scale(1.04)}}
#fl{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4}
#fl.go{animation:fl .5s}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#bn{position:fixed;left:0;right:0;top:24%;text-align:center;font:400 clamp(44px,9vw,110px)/1 var(--disp);letter-spacing:.04em;color:var(--gold);
  -webkit-text-stroke:3px var(--line);text-shadow:5px 6px 0 var(--line),0 0 40px rgba(255,90,20,.8);pointer-events:none;opacity:0;z-index:5;padding:0 16px;text-wrap:balance}
#bn.go{animation:bn 1.3s}
#bn small{display:block;font:700 .26em var(--ui);letter-spacing:.3em;color:var(--ink);-webkit-text-stroke:0;text-shadow:2px 2px 0 var(--line)}
@keyframes bn{0%{transform:scale(2.6) skewX(-10deg);opacity:0}14%{transform:scale(1) skewX(-10deg);opacity:1}82%{transform:scale(1.04) skewX(-10deg);opacity:1}100%{transform:scale(1.2) skewX(-10deg);opacity:0}}
.pop{position:fixed;font:400 46px var(--disp);letter-spacing:.03em;-webkit-text-stroke:2px var(--line);text-shadow:3px 4px 0 var(--line);pointer-events:none;animation:pp .9s forwards;z-index:2;white-space:nowrap}
.pop.dm{font-size:34px;color:#fff}
@keyframes pp{0%{transform:translate(-50%,0) scale(.2) rotate(-12deg);opacity:0}18%{transform:translate(-50%,-24px) scale(1.35) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-90px) scale(1) rotate(-6deg);opacity:0}}

/* ---------- Kampfleisten ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) var(--gr) 0 var(--gl);pointer-events:none;transition:opacity .2s;z-index:1}
.hb{flex:1;max-width:420px;display:flex;gap:8px;align-items:flex-start;min-width:0}
.hb.r{flex-direction:row-reverse;text-align:right}
.hb img{width:64px;height:64px;object-fit:cover;object-position:50% 12%;border:3px solid var(--line);background:var(--panel2);transform:skewX(-8deg);flex:none;box-shadow:3px 3px 0 var(--line)}
.hb.r img{transform:skewX(8deg) scaleX(-1)}
.hbx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.nm{font:400 24px/1 var(--disp);letter-spacing:.05em;color:#fff;text-shadow:2px 2px 0 var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:20px;background:#1b1830;border:3px solid var(--line);transform:skewX(-18deg);overflow:hidden;box-shadow:2px 2px 0 var(--line)}
.hb.r .bar{transform:skewX(18deg)}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .2s}
.hb.r .bar i{inset:0 0 0 auto}
.bar i.trail{background:#fff;transition:width .9s .25s}
#ph{background:linear-gradient(#8dffae,var(--hp) 45%,#1c9c46)}#eh{background:linear-gradient(#ff9c8f,var(--hot) 45%,#a8160f)}
.bar.mt{height:13px;width:74%}.hb.r .bar.mt{margin-left:auto}
#pm{background:linear-gradient(90deg,#ff8a00,var(--gold));width:0}#ec{background:linear-gradient(90deg,var(--violet),var(--cyan));width:0}
.bar.mt.full{animation:glow .5s infinite alternate}
@keyframes glow{to{box-shadow:0 0 16px 3px var(--gold)}}
.bar.warn{animation:warn .18s infinite alternate}
@keyframes warn{to{box-shadow:0 0 16px 3px var(--hot)}}
.lbl{font:700 10px var(--ui);letter-spacing:.22em;color:var(--dim);text-shadow:1px 1px 0 var(--line)}
#mid{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;text-align:center}
#lv{font:700 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;text-shadow:1px 1px 0 var(--line);max-width:26vw}
#lv b{display:block;font:400 22px var(--disp);letter-spacing:.06em;color:var(--gold)}
#pz{pointer-events:auto;width:48px;height:40px;background:var(--panel);border:3px solid var(--line);font:700 16px var(--ui);transform:skewX(-10deg);box-shadow:2px 2px 0 var(--line)}

/* ---------- Steuerpult ---------- */
#panel{position:fixed;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:flex-end;z-index:1;transition:opacity .2s;
  padding:40px var(--gr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gl);
  background:linear-gradient(transparent,rgba(8,6,18,.9) 26%,rgba(8,6,18,.97))}
#left{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#msg{font:700 15px var(--ui);min-height:20px;text-shadow:1px 1px 0 var(--line);letter-spacing:.02em}
#fin{position:relative;height:50px;border:3px solid var(--line);background:var(--panel);overflow:hidden;transform:skewX(-8deg);box-shadow:3px 3px 0 var(--line);
  display:flex;align-items:center;justify-content:center;gap:14px;width:100%;font:700 13px var(--ui);letter-spacing:.2em;color:var(--dim)}
#fin i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7a3a00,#c96a00);width:0;transition:width .3s}
#fin span,#fin b{position:relative}
#fin b{font:400 26px var(--disp);letter-spacing:.04em;display:none}
#fin.rdy{color:var(--line);animation:finp .45s infinite alternate}
#fin.rdy i{background:linear-gradient(90deg,var(--gold),#fff3a8,var(--gold))}
#fin.rdy b{display:inline}
#fin.sel{outline:4px solid #fff}
@keyframes finp{to{box-shadow:0 0 22px 4px var(--gold),3px 3px 0 var(--line)}}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{position:relative;overflow:hidden;text-align:left;padding:8px 12px 10px;min-height:104px;border:3px solid var(--line);background:var(--panel);
  box-shadow:4px 4px 0 var(--line);transition:transform .1s,background .1s;display:flex;flex-direction:column;justify-content:space-between;--k:var(--hot)}
.card.kick{--k:var(--cyan)}.card.wurf{--k:var(--violet)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--k)}
.card .kj{position:absolute;right:4px;top:-10px;font:900 74px/1 "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;color:var(--k);opacity:.2}
.card b{font:400 26px/1 var(--disp);letter-spacing:.06em;color:var(--k);padding-left:4px}
.card small{font:700 10px var(--ui);letter-spacing:.16em;color:var(--dim);padding-left:4px;text-transform:uppercase}
.card .q{font:700 clamp(17px,2.5vw,26px)/1.1 var(--ui);font-variant-numeric:tabular-nums;padding-left:4px;white-space:nowrap}
.card.sel{transform:translateY(-8px);background:var(--panel2);border-color:var(--k);box-shadow:0 0 0 2px var(--k),4px 8px 0 var(--line)}
.card.bad{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
body.lock .card,body.lock #fin{opacity:.45}
#side{width:min(40vw,390px);flex:none;display:flex;flex-direction:column;gap:8px}
#ans{height:54px;border:3px solid var(--line);background:#0e0c1c;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;
  font:700 clamp(18px,2.6vw,26px) var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;position:relative}
#ans em{font-style:normal;color:var(--gold);min-width:1ch}
#ans .hint{font-size:14px;color:var(--dim);letter-spacing:.04em;white-space:normal;line-height:1.15}
#ans u{text-decoration:none;font:400 20px var(--disp);letter-spacing:.05em;color:var(--gold)}
#bon{position:absolute;left:0;bottom:0;height:5px;background:var(--gold);width:0}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.k{height:clamp(52px,8.4vh,68px);font:700 28px var(--ui);border:3px solid var(--line);background:var(--panel2);box-shadow:3px 3px 0 var(--line)}
.k:active,.k.dn{background:var(--violet);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.k.ok{background:var(--hp);color:var(--line);font:400 30px var(--disp);letter-spacing:.06em}
.k.del{background:#3b2030}
@media (max-aspect-ratio:1/1){
  #panel{flex-direction:column;align-items:stretch}#side{width:100%}
  .card{min-height:92px}.card .kj{font-size:54px}
}

/* ---------- Menüs ---------- */
#menu{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;overflow:auto;touch-action:pan-y;
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px));padding-left:var(--gl);padding-right:var(--gr);
  background:radial-gradient(ellipse at 50% 30%,rgba(11,10,20,.35),rgba(11,10,20,.86) 75%)}
#menu>:first-child{margin-top:auto}#menu>:last-child{margin-bottom:auto}
#menu.solid{background:rgba(11,10,20,.9)}
.logo{font:400 clamp(64px,13vw,150px)/.82 var(--disp);letter-spacing:.03em;color:var(--hot);-webkit-text-stroke:3px var(--line);
  text-shadow:6px 7px 0 var(--line),0 0 50px rgba(255,60,20,.7);transform:rotate(-4deg) skewX(-6deg);margin:0}
.logo span{display:block;font-size:.5em;color:var(--gold)}
.tag{font:700 13px var(--ui);letter-spacing:.42em;color:var(--ink);text-transform:uppercase;text-shadow:1px 1px 0 var(--line)}
h2{font:400 clamp(34px,5.4vw,56px)/1 var(--disp);letter-spacing:.05em;margin:0;color:var(--gold);-webkit-text-stroke:1.5px var(--line);text-shadow:3px 4px 0 var(--line);text-wrap:balance}
#menu p{margin:0;max-width:52ch;font-size:16px;line-height:1.4;text-shadow:1px 1px 0 var(--line)}
.btn{font:400 30px/1 var(--disp);letter-spacing:.07em;padding:14px 38px;min-width:270px;min-height:60px;background:var(--hot);color:#fff;border:3px solid var(--line);
  box-shadow:5px 5px 0 var(--line);transform:skewX(-8deg);text-shadow:2px 2px 0 var(--line)}
.btn:active{transform:skewX(-8deg) translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.btn.alt{background:var(--panel2)}.btn.gold{background:var(--gold);color:var(--line);text-shadow:none}
.btn small{display:block;font:700 11px var(--ui);letter-spacing:.2em;margin-top:5px;opacity:.9;text-shadow:none}
.rowb{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.seg{display:flex;border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);transform:skewX(-8deg)}
.seg button{padding:11px 18px;min-height:48px;font:700 14px var(--ui);letter-spacing:.1em;background:var(--panel);color:var(--dim);text-transform:uppercase}
.seg button.on{background:var(--gold);color:var(--line)}
.seg button small{display:block;font-size:10px;letter-spacing:.06em;opacity:.8}
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.25}}

/* Kämpferwahl */
.sel{display:flex;gap:18px;width:100%;max-width:1120px;align-items:stretch;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:1.3;min-width:0;align-content:center}
.tile{position:relative;aspect-ratio:4/5;border:3px solid var(--line);background:var(--panel);overflow:hidden;box-shadow:3px 3px 0 var(--line)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;left:0;right:0;bottom:0;font:400 15px var(--disp);letter-spacing:.05em;background:rgba(5,4,10,.82);padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold);transform:scale(1.05);z-index:1}
.tile.lock img{filter:brightness(0) drop-shadow(0 0 5px var(--violet));opacity:.75}
.tile.lock::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:400 54px var(--disp);color:var(--violet);padding-bottom:16px}
.det{flex:1;min-width:0;display:flex;gap:10px;align-items:stretch;border:3px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));box-shadow:5px 5px 0 var(--line);padding:12px;text-align:left}
.det>img{width:42%;object-fit:contain;object-position:50% 100%;align-self:flex-end;max-height:46vh;filter:drop-shadow(4px 4px 0 var(--line))}
.det>img.lk{filter:brightness(0) drop-shadow(0 0 6px var(--violet))}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}
.info h3{font:400 clamp(28px,3.6vw,42px)/1 var(--disp);letter-spacing:.05em;margin:0;color:#fff;text-shadow:3px 3px 0 var(--line)}
.info .ti{font:700 11px var(--ui);letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.info p{font-size:14px!important;color:var(--dim)}
.st{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;font:700 11px var(--ui);letter-spacing:.14em;text-transform:uppercase}
.st div{display:flex;gap:3px}.st div i{flex:1;height:9px;background:#0e0c1c;transform:skewX(-20deg)}.st div i.f{background:var(--cyan)}
.fn{font:400 20px var(--disp);letter-spacing:.05em;color:var(--gold)}
.fn small{display:block;font:700 10px var(--ui);letter-spacing:.2em;color:var(--dim)}
.info .btn{min-width:0;font-size:26px;padding:12px 18px;align-self:stretch}
.info .btn[disabled]{background:var(--panel);color:var(--dim);box-shadow:none}
@media (max-aspect-ratio:1/1){.sel{flex-direction:column}.det>img{max-height:26vh;width:34%}}
/* VS */
.vs{display:flex;align-items:flex-end;justify-content:center;gap:2vw;width:100%}
.vs figure{margin:0;flex:1;max-width:38vw;animation:vsl .45s both}
.vs figure:last-child{animation-name:vsr}.vs figure:last-child img{transform:scaleX(-1)}
.vs img{height:min(52vh,460px);max-width:100%;object-fit:contain;filter:drop-shadow(6px 6px 0 var(--line))}
.vs figcaption{font:400 clamp(26px,4.4vw,48px) var(--disp);letter-spacing:.05em;text-shadow:3px 3px 0 var(--line)}
.vs .v{font:400 clamp(60px,11vw,130px) var(--disp);color:var(--hot);-webkit-text-stroke:3px var(--line);text-shadow:5px 6px 0 var(--line);align-self:center;animation:bn .5s both;transform:skewX(-10deg)}
@keyframes vsl{from{transform:translateX(-60vw)}}@keyframes vsr{from{transform:translateX(60vw)}}
.unl{height:min(44vh,380px);filter:drop-shadow(0 0 30px var(--gold));animation:unl 1s both}
@keyframes unl{0%{filter:brightness(0);transform:scale(.6)}60%{filter:brightness(0);transform:scale(1.05)}100%{transform:scale(1)}}
#snd{position:fixed;right:var(--gr);top:calc(10px + env(safe-area-inset-top,0px));z-index:7;width:52px;height:46px;background:var(--panel);border:3px solid var(--line);
  box-shadow:3px 3px 0 var(--line);font:700 12px var(--ui);letter-spacing:.06em;transform:skewX(-10deg)}
#snd.off{color:var(--dim);text-decoration:line-through}
@media (prefers-reduced-motion:reduce){.blink,#fin.rdy,.bar.mt.full{animation:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="speed"></div><div id="lb1" class="lb"></div><div id="lb2" class="lb"></div><div id="fl"></div><div id="bn"></div>
<div id="hud" hidden>
  <div class="hb l"><img id="pi" alt=""><div class="hbx"><div class="nm" id="pn"></div><div class="bar"><i class="trail" id="pht"></i><i id="ph"></i></div><div class="bar mt" id="pmb"><i id="pm"></i></div><div class="lbl">SPEZIAL</div></div></div>
  <div id="mid"><button id="pz" type="button" aria-label="Pause">II</button><div id="lv"></div></div>
  <div class="hb r"><img id="ei" alt=""><div class="hbx"><div class="nm" id="en"></div><div class="bar"><i class="trail" id="eht"></i><i id="eh"></i></div><div class="bar mt" id="ecb"><i id="ec"></i></div><div class="lbl">GEGNER-ANGRIFF</div></div></div>
</div>
<div id="panel" hidden>
  <div id="left"><div id="msg"></div><button id="fin" type="button"><i></i><span id="fint">SPEZIAL LÄDT</span><b id="finq"></b></button><div id="cards"></div></div>
  <div id="side"><div id="ans"></div><div id="pad"></div></div>
</div>
<div id="menu"></div>
<button id="snd" type="button" aria-label="Ton an oder aus">TON</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/audio.js"></script>
<script src="js/math.js"></script>
<script src="js/gfx.js"></script>
<script src="js/fighters.js"></script>
<script src="js/stages.js"></script>
<script src="js/game.js"></script>
</body></html>
